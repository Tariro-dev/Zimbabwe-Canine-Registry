<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" rx="200" fill="#0A0A0A"/>

  <defs>
    <linearGradient id="gold-gradient" x1="512" y1="200" x2="512" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5E0A3"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8B6B23"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Pads -->
    <ellipse cx="230" cy="450" rx="90" ry="140" fill="url(#gold-gradient)" transform="rotate(-30, 230, 450)"/>
    <ellipse cx="410" cy="270" rx="95" ry="160" fill="url(#gold-gradient)" transform="rotate(-10, 410, 270)"/>
    <ellipse cx="614" cy="270" rx="95" ry="160" fill="url(#gold-gradient)" transform="rotate(10, 614, 270)"/>
    <ellipse cx="794" cy="450" rx="90" ry="140" fill="url(#gold-gradient)" transform="rotate(30, 794, 450)"/>

    <!-- Large Palm Pad -->
    <path d="M512 400
             C370 400 300 500 300 680
             C300 860 400 920 512 920
             C624 920 724 860 724 680
             C724 500 654 400 512 400 Z" fill="url(#gold-gradient)"/>

    <!-- Precision Hand-Drawn Dog Silhouette Matching the provided image -->
    <path d="M430 780
             C410 750 400 680 415 620
             C425 570 445 530 475 515
             L490 420
             L530 520
             C550 510 570 510 590 525
             L610 420
             L635 525
             C665 540 685 580 690 630
             C695 680 685 750 660 800
             C635 850 580 880 512 880
             C445 880 430 830 430 780 Z" fill="#0A0A0A"/>
  </g>
</svg>
