<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded Square Background like App Icon -->
  <rect width="1024" height="1024" rx="220" fill="black"/>

  <defs>
    <linearGradient id="gold-shine" x1="512" y1="200" x2="512" y2="850" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5E0A3"/>
      <stop offset="0.4" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#8B6B23"/>
    </linearGradient>

    <filter id="outer-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" result="blur"/>
      <feOffset dx="0" dy="0" result="offsetblur"/>
      <feFlood flood-color="#D4AF37" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#outer-glow)">
    <!-- Top 4 Pads -->
    <ellipse cx="230" cy="420" rx="90" ry="140" fill="url(#gold-shine)" transform="rotate(-30, 230, 420)"/>
    <ellipse cx="410" cy="240" rx="95" ry="160" fill="url(#gold-shine)" transform="rotate(-10, 410, 240)"/>
    <ellipse cx="614" cy="240" rx="95" ry="160" fill="url(#gold-shine)" transform="rotate(10, 614, 240)"/>
    <ellipse cx="794" cy="420" rx="90" ry="140" fill="url(#gold-shine)" transform="rotate(30, 794, 420)"/>

    <!-- Bottom Large Pad -->
    <path d="M512 380
             C380 380 300 480 300 650
             C300 820 380 880 512 880
             C644 880 724 820 724 650
             C724 480 644 380 512 380 Z" fill="url(#gold-shine)"/>

    <!-- Dog Silhouette (facing right) integrated into the gold pad -->
    <path d="M540 500
             C525 500 510 510 500 540
             C490 570 490 610 505 650
             C515 680 535 720 560 740
             C580 755 620 755 640 730
             C660 710 670 660 675 620
             C680 580 670 540 650 520
             C630 500 580 495 560 520
             L550 480
             L520 510
             C530 505 540 500 540 500 Z" fill="black" />

    <!-- Detailed Doberman/German Shepherd Head Silhouette matching the image -->
    <path d="M520 520
             C500 520 480 540 475 580
             C470 620 470 680 500 740
             C520 780 570 780 600 740
             C630 700 650 640 650 580
             C650 540 630 520 610 520
             C590 520 570 530 560 550
             L550 470 L530 530
             C530 520 520 520 520 520 Z" fill="black" opacity="0.9"/>

    <!-- Final refined dog head silhouette based on visual feedback -->
    <path d="M410 740
             C390 710 380 650 400 580
             C410 540 430 510 460 500
             C480 495 500 505 515 530
             L525 450
             L545 520
             C560 510 580 510 600 520
             C630 535 650 570 660 620
             C670 680 650 740 600 790
             C550 840 450 820 410 740 Z" fill="black" />
  </g>
</svg>
