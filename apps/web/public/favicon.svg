<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1024" height="1024" rx="200" fill="#050505"/>
  <defs>
    <linearGradient id="gold-gradient" x1="512" y1="200" x2="512" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E2C17D"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#9A7B33"/>
    </linearGradient>
    <filter id="inner-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0" />
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="10"/>
      <feOffset dx="0" dy="10" result="offsetblur"/>
      <feFlood flood-color="black" flood-opacity="0.6"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode/>
      </feMerge>
    </filter>
  </defs>

  <!-- Top Pads -->
  <g filter="url(#inner-shadow)">
    <ellipse cx="280" cy="380" rx="80" ry="120" fill="url(#gold-gradient)" transform="rotate(-15, 280, 380)"/>
    <ellipse cx="430" cy="280" rx="85" ry="130" fill="url(#gold-gradient)"/>
    <ellipse cx="594" cy="280" rx="85" ry="130" fill="url(#gold-gradient)"/>
    <ellipse cx="744" cy="380" rx="80" ry="120" fill="url(#gold-gradient)" transform="rotate(15, 744, 380)"/>
  </g>

  <!-- Main Pad -->
  <g filter="url(#inner-shadow)">
    <path d="M512 430 C380 430 310 520 310 650 C310 780 380 850 512 850 C644 850 714 780 714 650 C714 520 644 430 512 430Z" fill="url(#gold-gradient)"/>
    <!-- Dog Silhouette cutout -->
    <path d="M512 510
             C480 510 460 530 450 560
             C440 590 440 650 480 720
             C495 745 529 745 544 720
             C584 650 584 590 574 560
             C564 530 544 510 512 510 Z" fill="#050505" opacity="0" /> <!-- Reference for shape -->

    <!-- Real Silhouette Cutout using mask or just drawing over with bg color -->
    <path d="M512 480
             C480 480 460 500 455 530
             L450 500 L440 530
             C435 550 435 580 445 610
             C460 660 490 700 512 730
             C534 700 564 660 579 610
             C589 580 589 550 584 530
             L574 500 L569 530
             C564 500 544 480 512 480 Z" fill="#050505" />

    <!-- Improved Silhouette Matching Image -->
    <path d="M512 490
             C480 490 465 520 455 560
             C440 620 440 680 475 750
             C490 780 534 780 549 750
             C584 680 584 620 569 560
             C559 520 544 490 512 490 Z" fill="#050505" />
    <!-- Ears -->
    <path d="M490 520 L475 460 L460 515 Z" fill="#050505" />
    <path d="M534 520 L549 460 L564 515 Z" fill="#050505" />
  </g>
</svg>
