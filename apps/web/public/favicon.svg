<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5E050;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B6B23;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="120" fill="#050505"/>
  <rect width="512" height="512" rx="120" fill="url(#goldGradient)" opacity="0.03"/>

  <g filter="url(#shadow)">
    <!-- Main Center Pad -->
    <path d="M256 215 C170 215 130 285 130 375 C130 445 180 490 256 490 C332 490 382 445 382 375 C382 285 342 215 256 215Z" fill="url(#goldGradient)"/>

    <!-- Detailed Dog Head Silhouette (Right Facing) -->
    <path d="M260 300
             C245 300 230 310 215 345
             C205 375 205 410 220 445
             C230 465 260 465 275 450
             C295 430 325 415 345 395
             C355 385 350 375 330 370
             C315 365 295 355 285 320
             C280 305 270 300 260 300 Z" fill="#050505" />
    <!-- Ears -->
    <path d="M245 315 L235 260 L220 310 Z" fill="#050505" />
    <path d="M265 310 L275 255 L290 310 Z" fill="#050505" />

    <!-- Outer Toe Pads -->
    <ellipse cx="105" cy="290" rx="45" ry="75" fill="url(#goldGradient)" transform="rotate(-30, 105, 290)"/>
    <ellipse cx="205" cy="155" rx="50" ry="85" fill="url(#goldGradient)" transform="rotate(-12, 205, 155)"/>
    <ellipse cx="307" cy="155" rx="50" ry="85" fill="url(#goldGradient)" transform="rotate(12, 307, 155)"/>
    <ellipse cx="407" cy="290" rx="45" ry="75" fill="url(#goldGradient)" transform="rotate(30, 407, 290)"/>
  </g>
</svg>
