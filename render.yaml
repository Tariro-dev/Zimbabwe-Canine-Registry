services:
  # 1. The Backend API Server
  - type: web
    name: zcr-api
    env: node
    plan: free
    buildCommand: pnpm install && pnpm --filter @workspace/api-server run build
    startCommand: pnpm --filter @workspace/api-server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set this in the Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

  # 2. The Web Frontend (Static Site)
  - type: static
    name: zcr-web
    buildCommand: pnpm install && pnpm --filter @workspace/web run build
    publishDir: apps/web/dist/public
    envVars:
      - key: VITE_API_URL
        fromService:
          name: zcr-api
          type: web
          property: host
